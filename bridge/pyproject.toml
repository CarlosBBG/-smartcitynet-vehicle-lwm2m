[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcitynet-bridge"
version = "0.1.0"
description = "Bridge MQTT TTN para administracion LwM2M sobre LoRaWAN"
requires-python = ">=3.10"
dependencies = ["paho-mqtt>=2.1,<3"]

[project.scripts]
smartcitynet-bridge = "smartcitynet_bridge.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["smartcitynet_bridge*"]
